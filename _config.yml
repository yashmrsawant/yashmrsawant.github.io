url: "https://yashmrsawant.github.io"
baseurl: ""

# Author information
author:
  name: Yash M. Sawant
  title: Ph.D. in Mathematical Sciences · IISc Bangalore
  email: sawantyashm@gmail.com
  github: yashmrsawant
