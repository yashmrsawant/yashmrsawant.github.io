title: Scith
tagline: Exploring the Fundamental Principles of Intelligence
description: >-
  Welcome to Scith. Here, we explore the fundamental principles through which the nature of intelligence is defined in our universe—through first-principles mathematical expositions and research at the intersection of computational neuroscience, signal processing, neural dynamics, and probabilistic machine learning (NeuroAI).
url: "https://yashmrsawant.github.io"
baseurl: ""

