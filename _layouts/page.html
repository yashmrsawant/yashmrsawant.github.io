---
layout: default
---

<article class="page-article">
  {% if page.title %}
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  {% endif %}

  <div class="page-body markdown-body">
    {{ content }}
  </div>
</article>
